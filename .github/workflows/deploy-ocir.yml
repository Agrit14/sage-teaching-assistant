name: Build and Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Oracle VM
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and package with Maven
        run: ./mvnw clean package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Docker Container to Oracle VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm

          # 2. Detect Remote VM Architecture
          REMOTE_ARCH=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST "uname -m")
          echo "Detected remote VM architecture: $REMOTE_ARCH"
          if [ "$REMOTE_ARCH" = "aarch64" ] || [ "$REMOTE_ARCH" = "arm64" ]; then
            PLATFORM="linux/arm64"
          else
            PLATFORM="linux/amd64"
          fi

          # 3. Build image directly for target platform
          echo "Building Docker image for platform $PLATFORM..."
          docker buildx build --platform "$PLATFORM" -t sage-teaching-assistant:latest --load .

          # 4. Stream compressed image directly to remote VM and load
          echo "Streaming and loading Docker image on remote VM..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST "mkdir -p ~/sage-app"
          docker save sage-teaching-assistant:latest | gzip | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST "gunzip | docker load"

          # 5. Copy docker-compose.prod.yml and restart services
          echo "Updating docker-compose and starting services..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_vm docker-compose.prod.yml $VM_USER@$VM_HOST:~/sage-app/docker-compose.prod.yml
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST << EOF
            cd ~/sage-app
            export IMAGE_NAME="sage-teaching-assistant:latest"
            export GEMINI_API_KEY="$GEMINI_API_KEY"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF
