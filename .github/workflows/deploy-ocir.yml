name: Build and Push to Oracle Cloud Infrastructure Registry (OCIR)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Artifacts
    # Run if pushed directly to main/master, triggered manually, or if a PR was merged
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    env:
      REGISTRY: ${{ secrets.OCI_REGISTRY }}
      TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
      REPO_NAME: ${{ secrets.OCI_REPOSITORY_NAME != '' && secrets.OCI_REPOSITORY_NAME || 'sage-teaching-assistant' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and package with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-teaching-assistant-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.TENANCY_NAMESPACE }}/${{ env.REPO_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build and push Docker image to OCIR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup SSH key and Deploy to Oracle VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          REGISTRY: ${{ secrets.OCI_REGISTRY }}
          USERNAME: ${{ secrets.OCI_USERNAME }}
          PASSWORD: ${{ secrets.OCI_AUTH_TOKEN }}
          IMAGE_NAME: ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_REPOSITORY_NAME != '' && secrets.OCI_REPOSITORY_NAME || 'sage-teaching-assistant' }}:latest
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Prepare SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm

          # 2. Ensure remote directory exists and copy docker-compose.prod.yml
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST "mkdir -p ~/sage-app"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_vm docker-compose.prod.yml $VM_USER@$VM_HOST:~/sage-app/docker-compose.prod.yml

          # 3. Deploy via SSH
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST << EOF
            cd ~/sage-app
            echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin
            export IMAGE_NAME="$IMAGE_NAME"
            export GEMINI_API_KEY="$GEMINI_API_KEY"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF
