name: Build and Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - closed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Oracle VM
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and package JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Deploy to Oracle VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm

          # 2. Ensure remote directories exist
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST "mkdir -p ~/sage-app/target"

          # 3. Transfer pre-built JAR, Dockerfile, and docker-compose
          echo "Copying application artifacts to Oracle VM..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_vm target/*.jar $VM_USER@$VM_HOST:~/sage-app/target/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_vm Dockerfile docker-compose.prod.yml $VM_USER@$VM_HOST:~/sage-app/

          # 4. Build image natively on VM and restart containers
          echo "Building Docker container natively and starting service..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_vm $VM_USER@$VM_HOST << 'EOF'
            cd ~/sage-app
            docker build -t sage-teaching-assistant:latest .
            export IMAGE_NAME="sage-teaching-assistant:latest"
            export GEMINI_API_KEY="$GEMINI_API_KEY"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF
