services:
  postgres:
    image: postgres:17-alpine
    container_name: sage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sage
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
    ports:
      - "5433:5432"
    volumes:
      - sage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sage-pgdata:
