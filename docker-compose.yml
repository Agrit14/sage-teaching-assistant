services:
  postgres:
    image: postgres:17-alpine
    container_name: sage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sage
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
    ports:
      - "5433:5432"
    volumes:
      - sage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: sage-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SAGE_DB_URL: jdbc:postgresql://postgres:5432/sage
      SAGE_DB_USER: sage
      SAGE_DB_PASSWORD: sage
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      SAGE_STORAGE_PATH: /app/data/files
    volumes:
      - sage-files:/app/data/files

volumes:
  sage-pgdata:
  sage-files:

