spring:
  application:
    name: sage-teaching-assistant

  datasource:
    url: ${SAGE_DB_URL:jdbc:postgresql://localhost:5433/sage}
    username: ${SAGE_DB_USER:sage}
    password: ${SAGE_DB_PASSWORD:sage}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: sage-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  # 8081 rather than the usual 8080: something else on this machine already
  # holds 8080. Override with SAGE_PORT.
  port: ${SAGE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
