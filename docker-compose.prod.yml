services:
  postgres:
    image: postgres:17-alpine
    container_name: sage-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sage}
      POSTGRES_USER: ${POSTGRES_USER:-sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sage}
    volumes:
      - sage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sage} -d ${POSTGRES_DB:-sage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  sage-app:
    image: ${IMAGE_NAME}
    container_name: sage-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SAGE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sage}
      SAGE_DB_USER: ${POSTGRES_USER:-sage}
      SAGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-sage}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      SAGE_STORAGE_PATH: /app/data/files
      SAGE_PORT: 8081
    volumes:
      - sage-files:/app/data/files
    networks:
      - app-network

volumes:
  sage-pgdata:
  sage-files:

networks:
  app-network:
    driver: bridge
